<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&amp;family=Syne:wght@800&amp;display=swap');
      .aee-monogram { font-family: 'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
      .aee-title { font-family: 'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.015em; fill: #08365f; }
      .aee-sub { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.18em; font-weight: 500; text-transform: uppercase; fill: #0b5ea8; }
    </style>
  </defs>
  <!-- 7A Cut Corner Emblem -->
  <polygon points="3,3 125,3 125,52 101,77 3,77" fill="#08365f" stroke="#0bd9e7" stroke-width="3" stroke-linejoin="round" />
  <text x="64" y="49" text-anchor="middle" class="aee-monogram">
    <tspan fill="#ffffff">A</tspan><tspan fill="#0bd9e7">E</tspan><tspan fill="#ffffff">E</tspan>
  </text>
  <!-- Wordmark -->
  <text x="148" y="40" class="aee-title">AEE</text>
  <text x="148" y="62" class="aee-sub">ACADEMIA EXAMEN EUNACOM</text>
</svg>